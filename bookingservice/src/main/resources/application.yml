spring:
  application:
    name: bookingservice

  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${PORT:9900}

  servlet:
    context-path: /api

  shutdown: graceful

  compression:
    enabled: true
    mime-types:
      - application/json
      - text/html
      - text/plain

# =========================================================
# CLOUDFLARE R2
# =========================================================

r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  bucket: ${R2_BUCKET}
  endpoint: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
  region: auto

# =========================================================
# WHATSAPP
# =========================================================

whatsapp:
  base-url: ${WHATSAPP_BASE_URL:}
  auth-key: ${WHATSAPP_AUTH_KEY:}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  booking-confirmation-template-id: ${WHATSAPP_BOOKING_CONFIRMATION_TEMPLATE_ID:}

# =========================================================
# EUREKA
# =========================================================

eureka:
  client:
    register-with-eureka: ${EUREKA_REGISTER:true}
    fetch-registry: ${EUREKA_FETCH:true}

    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

# =========================================================
# RESILIENCE4J
# =========================================================

resilience4j:
  circuitbreaker:
    instances:
      adminService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        automatic-transition-from-open-to-half-open-enabled: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        record-exceptions:
          - java.lang.Exception
          - feign.FeignException
        ignore-exceptions:
          - java.lang.IllegalArgumentException

      clinicAdminService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        automatic-transition-from-open-to-half-open-enabled: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        record-exceptions:
          - java.lang.Exception
          - feign.FeignException
        ignore-exceptions:
          - java.lang.IllegalArgumentException

      notificationService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        automatic-transition-from-open-to-half-open-enabled: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        record-exceptions:
          - java.lang.Exception
          - feign.FeignException
        ignore-exceptions:
          - java.lang.IllegalArgumentException

      physioDoctorService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        automatic-transition-from-open-to-half-open-enabled: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        record-exceptions:
          - java.lang.Exception
          - feign.FeignException
        ignore-exceptions:
          - java.lang.IllegalArgumentException

      keyclaok:
        failure-rate-threshold: 50
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 5
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 4
        wait-duration-in-open-state: 1m
        record-exceptions:
          - java.lang.Exception
          - feign.FeignException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - java.lang.IllegalArgumentException
          - org.springframework.web.bind.MethodArgumentNotValidException
          - org.springframework.web.server.ResponseStatusException

  retry:
    instances:
      adminService:
        max-attempts: 3
        wait-duration: 2s

      clinicAdminService:
        max-attempts: 3
        wait-duration: 2s

      notificationService:
        max-attempts: 3
        wait-duration: 2s

      physioDoctorService:
        max-attempts: 3
        wait-duration: 2s

      keyclaok:
        max-attempts: 3
        wait-duration: 2s

  timelimiter:
    instances:
      bookingService:
        timeout-duration: 60s

      clinicAdminService:
        timeout-duration: 60s

      notificationService:
        timeout-duration: 60s

      physioDoctorService:
        timeout-duration: 60s

  ratelimiter:
    instances:
      bookingService:
        limit-for-period: 50
        limit-refresh-period: 1m
        timeout-duration: 1s

      keyclaok:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 2s

# =========================================================
# ACTUATOR
# =========================================================

management:
  server:
    base-path: /

  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# =========================================================
# INFO
# =========================================================

info:
  app:
    name: bookingservice
    description: Service responsible for booking appointments
    version: 1.0.0

# =========================================================
# LOGGING
# =========================================================

logging:
  level:
    root: INFO
