# ===============================
# Application
# ===============================
spring.application.name=clinicadmin
server.port=${PORT:8080}


# ===============================
# Eureka
# ===============================
eureka.client.fetch-registry=${EUREKA_FETCH:true}
eureka.client.register-with-eureka=${EUREKA_REGISTER:true}
eureka.client.healthcheck.enabled=false
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90


# ===============================
# MongoDB
# ===============================
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=false


# ===============================
# Server Timeouts
# ===============================
server.tomcat.connection-timeout=60s
spring.mvc.async.request-timeout=60000


# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false


# ===============================
# Mail Configuration
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false

# Keep false in production
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}


# ===============================
# Cloudflare R2
# ===============================
r2.account-id=${R2_ACCOUNT_ID}
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.bucket=${R2_BUCKET}
r2.endpoint=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
r2.region=${R2_REGION:auto}


# ===============================
# Firebase
# ===============================
app.firebase-configuration-file=${FIREBASE_CONFIG_FILE:firebase-key.json}


# ===============================
# WhatsApp
# ===============================
whatsapp.base-url=${WHATSAPP_BASE_URL:http://localhost:8080/mock-whatsapp}
whatsapp.auth-key=${WHATSAPP_AUTH_KEY:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.single-user-notification-template-id=${WHATSAPP_SINGLE_USER_NOTIFICATION_TEMPLATE_ID:}


# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.clinicadmin=INFO


# ===============================
# Application Base URL
# ===============================
app.base-url=${APP_BASE_URL:http://localhost:8080}


# ===============================
# OpenFeign
# ===============================
spring.cloud.openfeign.client.config.default.connectTimeout=30000
spring.cloud.openfeign.client.config.default.readTimeout=60000
spring.cloud.openfeign.client.config.default.loggerLevel=BASIC