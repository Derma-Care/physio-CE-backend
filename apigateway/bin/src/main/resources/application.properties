spring.application.name=apigateway
server.port=${PORT:9090}

# Reactive Application
spring.main.web-application-type=reactive

# =========================================================
# EUREKA
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.fetch-registry=${EUREKA_FETCH:true}
eureka.client.register-with-eureka=${EUREKA_REGISTER:true}

eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=15
eureka.instance.lease-expiration-duration-in-seconds=45

# =========================================================
# GATEWAY TIMEOUTS
# =========================================================
spring.cloud.gateway.httpclient.connect-timeout=30000
spring.cloud.gateway.httpclient.response-timeout=120s
spring.cloud.gateway.httpclient.pool.max-connections=100
spring.cloud.gateway.httpclient.pool.acquire-timeout=30000
server.netty.idle-timeout=60s

# =========================================================
# ROUTES
# =========================================================

spring.cloud.gateway.routes[0].id=admin-service
spring.cloud.gateway.routes[0].uri=lb://adminservice
spring.cloud.gateway.routes[0].predicates[0]=Path=/admin/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/admin/(?<segment>.*), /admin/${segment}

spring.cloud.gateway.routes[1].id=clinic-admin-service
spring.cloud.gateway.routes[1].uri=lb://clinicadmin
spring.cloud.gateway.routes[1].predicates[0]=Path=/clinic-admin/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/clinic-admin/(?<segment>.*), /clinic-admin/${segment}

spring.cloud.gateway.routes[2].id=customerservice
spring.cloud.gateway.routes[2].uri=lb://customerservice
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/customer/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/customer/(?<segment>.*), /api/customer/${segment}

spring.cloud.gateway.routes[3].id=physiotherapydoctor-service
spring.cloud.gateway.routes[3].uri=lb://physiotherapydoctor-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/physiotherapy-doctor/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/physiotherapy-doctor/(?<segment>.*), /api/physiotherapy-doctor/${segment}

spring.cloud.gateway.routes[4].id=bookingservice
spring.cloud.gateway.routes[4].uri=lb://bookingservice
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/api/v1/(?<segment>.*), /api/v1/${segment}

spring.cloud.gateway.routes[5].id=pdf-open-service
spring.cloud.gateway.routes[5].uri=lb://clinicadmin
spring.cloud.gateway.routes[5].predicates[0]=Path=/pdf/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/pdf/(?<segment>.*), /pdf/${segment}

# =========================================================
# CORS
# =========================================================

spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=${FRONTEND_URLS:http://localhost:3000,http://localhost:3001}
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,gateway,routes
management.endpoint.health.show-details=always

# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.cloud.gateway=INFO
logging.level.reactor.netty=INFO